name: campus_ar_mobile

description: Flutter mobile client for Campus AR Navigation & Accessibility Assistant.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  flutter_reactive_ble: ^5.2.0
  flutter_tts: ^3.2.0
  vibration: ^1.8.4
  http: ^1.0.0
  permission_handler: ^11.0.0
  sensors_plus: ^5.0.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  ar_flutter_plugin: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
